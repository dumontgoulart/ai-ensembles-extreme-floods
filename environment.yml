name: ai-ensembles-extreme-floods
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.3
  - pandas=3.0
  - xarray=2026.2
  - scipy=1.17
  - matplotlib=3.10
  - geopandas=1.1
  - shapely=2.1
  - pyproj=3.7
  - rasterio=1.4
  - rioxarray=0.19
  - netcdf4=1.7
  - cfgrib=0.9.15
  - eccodes=2.44
  - python-eccodes
  - hydromt=1.3
  - hydromt_wflow=1.0.2
  - pyflwdir=0.5
  - openpyxl=3.1
  - requests
  - cdsapi
# Hydrological model: Wflow.jl 1.0.2 (Julia), in a Julia project named "wflow1":
#   julia --project=@wflow1 -e 'using Pkg; Pkg.add(name="Wflow", version="1.0.2")'
